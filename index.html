<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo List Semester 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Todo List Semester 3</h1>
        <p>Manage your daily tasks in semester 3</p>

    <button type="button" id="theme_button">
        🌙 Dark Mode
    </button>
    </header>

    <main>

        <section class="input-panel">

            <h2>Create New Todo</h2>

            <form>

                <label for="title">Judul TODO</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Masukkan Judul"
                >

                <label for="description">Keterangan</label>

                <textarea
                    id="description"
                    placeholder="Tambahkan Keterangan"
                ></textarea>

                <button type="submit">
                    Buat
                </button>

            </form>

        </section>

        <section class="detail-panel">

            <h2>Todo Detail</h2>

            <article class="todo-detail">

                <h3>Belajar HTML & CSS</h3>

                <p>
                    Belajar membuat website sederhana
                    menggunakan HTML dan CSS.
                </p>

            </article>

        </section>

    </main>

    <footer>
        <p>Todo list 2026</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
